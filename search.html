<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Results | Gouldings Global Academy</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/search.css">

</head>

<body>

    <!-- Navbar -->

    <div id="navbar"></div>


    <!-- Search Results -->

    <section class="search-page">

        <div class="container">

            <h1>Search Results</h1>

            <div class="search-divider"></div>


            <!-- Search Form -->

            <form
                action="search.html"
                method="GET"
                class="search-form">

                <input
                    type="search"
                    id="searchInput"
                    name="query"
                    placeholder="Search the website..."
                    autocomplete="off">

                <button type="submit">

                    Search

                </button>

            </form>


            <!-- Search Results -->

            <div
                id="resultsContainer"
                class="results-container">

            </div>

        </div>

    </section>


    <!-- Footer -->

    <div id="footer"></div>


    <script src="js/include.js"></script>


    <script src="js/search.js"></script>

</body>

</html>
