<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Staff Login | Gouldings Staff LMS</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<link rel="stylesheet" href="css/pages/login.css">

</head>

<body>

<div class="login-page">

    <!-- LEFT PANEL -->

    <div class="login-left">

        <div class="overlay"></div>

        <div class="branding">

            <img
                src="../images/logo.png"
                class="logo"
                alt="Gouldings">

            <span class="badge">

                GOULDINGS STAFF LMS

            </span>

            <h1>

                Welcome to

                <span>Gouldings Staff LMS</span>

            </h1>

            <p>

                Manage students, meetings, attendance,
                assignments, courses and reports from one
                secure platform.

            </p>

            <div class="feature-list">

                <div>

                    <i class="fa-solid fa-user-graduate"></i>

                    Student Management

                </div>

                <div>

                    <i class="fa-solid fa-video"></i>

                    Live Meetings

                </div>

                <div>

                    <i class="fa-solid fa-book-open"></i>

                    Courses

                </div>

                <div>

                    <i class="fa-solid fa-chart-line"></i>

                    Reports

                </div>

            </div>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="login-right">

        <div class="login-card">
           
          <div class="login-logo">
             

             <img src="images/logos/logo-white.png" alt="Gouldings">
               </div>


            <h2>

                Welcome Back

            </h2>

            <p>

                Sign in to continue.

            </p>


            <div class="register-link">
    Don't have an account?
    <a href="register.html" class="register-btn">Register Now</a>

    
            <form
            
                id="loginForm">

                <div class="form-group">

                    <label>

                        Email Address

                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            id="email"
                            type="email"
                            placeholder="name@gouldings.education"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>

                        Password

                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-btn">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label>

                        <input
                            type="checkbox">

                        Remember me

                    </label>

                    <a
                        href="forgot-password.html">

                        Forgot Password?

                    </a>

                </div>

                <button
                    class="login-btn"
                    type="submit">

                    <i class="fa-solid fa-arrow-right-to-bracket"></i>

                    Sign In

                </button>

                <div
                    id="loginMessage">

                </div>

            </form>

        </div>

    </div>

</div>

<script src="js/auth/login.js"></script>

</body>

</html>
