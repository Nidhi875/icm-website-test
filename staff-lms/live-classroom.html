<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Classroom</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/live-classroom.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
rel="stylesheet">

</head>

<body>

<div id="sidebar"></div>

<div class="main-content">

<div id="header"></div>

<section class="live-classroom">

<div class="classroom-header">

<h1>Business Management Live Class</h1>

<div class="class-status live">

● LIVE

</div>

</div>

<div class="classroom-grid">

<div class="video-section">

<div class="teacher-video">

<div class="video-placeholder">

<i class="fa-solid fa-video"></i>

<h2>Teacher Camera</h2>

<p>Live stream will appear here</p>

</div>

</div>

<div class="student-videos">

<div class="student-tile">Student 1</div>

<div class="student-tile">Student 2</div>

<div class="student-tile">Student 3</div>

<div class="student-tile">Student 4</div>

<div class="student-tile">Student 5</div>

<div class="student-tile">Student 6</div>

</div>

</div>

<aside class="chat-panel">

<h3>Live Chat</h3>

<div class="chat-messages" id="chatMessages"></div>

<div class="chat-input">

<input
type="text"
placeholder="Type message...">

<button>

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</aside>

</div>

<div class="meeting-controls">

<button class="control-btn">

<i class="fa-solid fa-microphone"></i>

</button>

<button class="control-btn">

<i class="fa-solid fa-video"></i>

</button>

<button class="control-btn">

<i class="fa-solid fa-display"></i>

</button>

<button class="control-btn">

<i class="fa-solid fa-users"></i>

</button>

<button class="control-btn">

<i class="fa-solid fa-record-vinyl"></i>

</button>

<button class="control-btn end">

<i class="fa-solid fa-phone-slash"></i>

End Class

</button>

</div>

</section>

</div>

<script src="js/live-classroom.js"></script>

</body>

</html>
