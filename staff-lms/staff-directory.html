<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Directory | Gouldings Staff LMS</title>

  <!-- Same stylesheets as operations.html, so this page matches the rest of the site -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout/grid.css">
  <link rel="stylesheet" href="css/layout/sidebar.css">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Small additions specific to this page only —
       everything else comes from the shared CSS above */
    .staff-table { width: 100%; border-collapse: collapse; }
    .staff-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 13px;
      opacity: .6;
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
    .staff-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      vertical-align: middle;
    }
    .staff-table input[type="text"],
    .staff-table input[type="tel"],
    .staff-table select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid rgba(0,0,0,.15);
      border-radius: 6px;
      font-size: 14px;
    }
    .staff-actions { display: flex; gap: 8px; white-space: nowrap; }
    .staff-remove-btn {
      background: none;
      border: none;
      color: #c0392b;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
    }
    .staff-add-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 640px;
      margin-top: 12px;
    }
    .staff-add-form label { font-size: 13px; opacity: .75; display: block; margin-bottom: 6px; }
    .staff-add-form input, .staff-add-form select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(0,0,0,.15);
      border-radius: 6px;
    }
    .staff-add-form .full-width { grid-column: 1 / -1; }
    .staff-denied {
      padding: 20px;
      border-radius: 10px;
      background: #fee2e2;
      color: #991b1b;
    }
    .staff-temp-password {
      padding: 16px;
      border-radius: 10px;
      background: #dcfce7;
      color: #166534;
      margin-bottom: 18px;
    }
    .staff-temp-password code {
      background: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* =========================================================
   STAFF DIRECTORY
   Responsive design
   ========================================================= */

.staff-directory-page {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 60px;
    box-sizing: border-box;
}

/* Page heading */
.staff-directory-page h1 {
    color: #09244a;
    font-size: 42px;
    font-weight: 700;
    margin: 0 0 10px;
}

.staff-directory-page > p {
    color: #64748b;
    font-size: 17px;
    margin-bottom: 30px;
}

/* Main staff card */
.staff-directory-card {
    width: 100%;
    background: #ffffff;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
    overflow: hidden;
}

/* Table wrapper */
.staff-table-wrapper {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

/* Table */
.staff-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

.staff-table thead {
    background: #f8fafc;
}

.staff-table th {
    padding: 16px 20px;
    text-align: left;
    color: #475569;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid #e2e8f0;
}

.staff-table td {
    padding: 16px 20px;
    color: #1e293b;
    font-size: 15px;
    border-bottom: 1px solid #edf0f3;
    vertical-align: middle;
}

.staff-table tbody tr:last-child td {
    border-bottom: none;
}

.staff-table tbody tr:hover {
    background: #f8fafc;
}

/* Staff name */
.staff-name {
    font-weight: 600;
    color: #09244a;
}

/* Email */
.staff-email {
    color: #475569;
}

/* Role badge */
.staff-role {
    display: inline-flex;
    align-items: center;
    padding: 5px 10px;
    border-radius: 6px;
    background: #f1f5f9;
    color: #334155;
    font-size: 13px;
    font-weight: 600;
}

/* Admin badge */
.staff-role.admin {
    background: #fff7df;
    color: #8a6500;
}

/* Action buttons */
.staff-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.staff-actions button {
    border: 1px solid #dbe2ea;
    background: #ffffff;
    color: #334155;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s ease;
}

.staff-actions button:hover {
    background: #f1f5f9;
}

.staff-actions .edit-btn {
    color: #09244a;
}

.staff-actions .delete-btn {
    color: #b42318;
    border-color: #f1d0cc;
}

.staff-actions .delete-btn:hover {
    background: #fff5f4;
}

/* Admin add button */
.add-staff-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #09244a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

.add-staff-btn:hover {
    background: #12345f;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

    .staff-directory-page {
        padding: 24px 16px 40px;
    }

    .staff-directory-page h1 {
        font-size: 32px;
        line-height: 1.2;
    }

    .staff-directory-page > p {
        font-size: 15px;
        margin-bottom: 22px;
    }

    .staff-directory-card {
        border-radius: 14px;
    }

    /*
       Instead of making the table extremely wide on phones,
       convert each staff row into a card.
    */

    .staff-table-wrapper {
        overflow: visible;
    }

    .staff-table {
        min-width: 0;
        width: 100%;
    }

    .staff-table thead {
        display: none;
    }

    .staff-table,
    .staff-table tbody,
    .staff-table tr,
    .staff-table td {
        display: block;
        width: 100%;
        box-sizing: border-box;
    }

    .staff-table tbody tr {
        padding: 16px;
        border-bottom: 1px solid #e5e7eb;
    }

    .staff-table tbody tr:last-child {
        border-bottom: none;
    }

    .staff-table td {
        border: none;
        padding: 5px 0;
        font-size: 14px;
    }

    .staff-table td::before {
        display: block;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 2px;
    }

    .staff-table td:nth-child(1)::before {
        content: "Name";
    }

    .staff-table td:nth-child(2)::before {
        content: "Email";
    }

    .staff-table td:nth-child(3)::before {
        content: "Role";
    }

    .staff-table td:nth-child(4)::before {
        content: "Actions";
    }

    .staff-name {
        font-size: 16px;
    }

    .staff-email {
        word-break: break-word;
    }

    .staff-actions {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #f1f5f9;
    }

    .staff-actions button {
        min-height: 38px;
        padding: 8px 14px;
    }

    .add-staff-btn {
        width: 100%;
        min-height: 44px;
        margin-bottom: 16px;
    }
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 480px) {

    .staff-directory-page {
        padding: 20px 12px 32px;
    }

    .staff-directory-page h1 {
        font-size: 28px;
    }

    .staff-directory-page > p {
        font-size: 14px;
    }

    .staff-directory-card {
        border-radius: 12px;
    }

    .staff-table tbody tr {
        padding: 14px;
    }

    .staff-actions {
        gap: 6px;
    }

    .staff-actions button {
        flex: 1;
    }
}
  </style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div id="header"></div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="page-wrapper">

      <div class="page-header">
        <div class="header-left">
          <h1 class="page-title">Staff Directory</h1>
          <p class="page-subtitle">Manage staff accounts and roles</p>
        </div>
      </div>

      <div id="staffMsg" class="staff-temp-password" style="display:none;"></div>

      <section id="staffContent">
        <p style="opacity:.6;">Loading staff directory…</p>
      </section>

    </div>
  </div>
</div>

<script src="js/common/app.js"></script>

<script>

const API_BASE = "https://icm-website-test-production.up.railway.app";

function getToken() {
  return localStorage.getItem("staffToken");
}

function getCurrentEmail() {
  return (
    localStorage.getItem("staffEmail") ||
    localStorage.getItem("email") ||
    localStorage.getItem("userEmail") ||
    ""
  ).trim().toLowerCase();
}

function getRole() {
  return (localStorage.getItem("staffRole") || "").trim();
}

function isAdmin() {
  const role = getRole().toLowerCase();

  return (
    role === "administrator" ||
    role === "admin"
  );
}


function showMsg(text, isSuccess = false) {
  const box = document.getElementById("staffMsg");

  if (!box) return;

  box.style.display = "block";
  box.style.background = isSuccess ? "#dcfce7" : "#fee2e2";
  box.style.color = isSuccess ? "#166534" : "#991b1b";
  box.innerHTML = text;
}

async function init() {
  const content = document.getElementById("staffContent");

  if (!content) {
    console.error("staffContent element not found");
    return;
  }

  const admin = isAdmin();

  content.innerHTML = `
    <div class="glass-card" style="margin-bottom:20px;">
      <table class="staff-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            ${admin ? "<th>Actions</th>" : ""}
          </tr>
        </thead>

        <tbody id="staff-body">
          <tr>
            <td colspan="${admin ? 5 : 4}" style="text-align:center;">
              Loading staff...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    ${
      admin
        ? `
      <div class="glass-card">
        <div class="card-title">
          <h3>Add staff member</h3>
        </div>

        <div class="staff-add-form">

          <div>
            <label>Name</label>
            <input id="new-name" type="text">
          </div>

          <div>
            <label>Email</label>
            <input id="new-email" type="email">
          </div>

          <div>
            <label>Phone</label>
            <input id="new-phone" type="tel" placeholder="Optional">
          </div>

          <div>
            <label>Role</label>
            <select id="new-role">
              <option value="Team Member">Team Member</option>
              <option value="Administrator">Administrator</option>
            </select>
          </div>

          <div class="full-width">
            <button id="add-btn" class="primary-btn">
              Add staff member
            </button>
          </div>

        </div>
      </div>
    `
        : ""
    }
  `;

  const addBtn = document.getElementById("add-btn");

  if (addBtn) {
    addBtn.addEventListener("click", addStaff);
  }

  await loadStaff();
}


/* =========================================================
   LOAD STAFF
========================================================= */

async function loadStaff() {
  const body = document.getElementById("staff-body");

  if (!body) {
    console.error("staff-body not found");
    return;
  }

  try {
    const token = getToken();

    if (!token) {
      throw new Error("You are not logged in.");
    }

    console.log("Loading staff directory...");

    const res = await fetch(`${API_BASE}/api/staff`, {
      method: "GET",
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    console.log("GET /api/staff status:", res.status);

    let data;

    try {
      data = await res.json();
    } catch {
      throw new Error(`Server returned HTTP ${res.status}`);
    }

    console.log("Staff API response:", data);

    if (!res.ok || !data.success) {
      throw new Error(data.message || `HTTP ${res.status}`);
    }

    const staff = Array.isArray(data.staff) ? data.staff : [];

    if (staff.length === 0) {
      body.innerHTML = `
        <tr>
          <td colspan="${isAdmin() ? 5 : 4}"
              style="text-align:center; padding:25px; opacity:.6;">
            No staff members found.
          </td>
        </tr>
      `;
      return;
    }

    body.innerHTML = "";

    staff.forEach(person => {
      const row = document.createElement("tr");

      const name = person.name || "";
      const email = person.email || "";
      const phone = person.phone || "";
      const role = person.role || "Team Member";

      row.innerHTML = `
        <td>
          <input
            type="text"
            class="name-input"
            data-id="${person.id}"
            value="${escapeHtml(name)}"
            ${isAdmin() ? "" : "readonly"}
          >
        </td>

        <td>
          ${escapeHtml(email)}
        </td>

        <td>
          <input
            type="tel"
            class="phone-input"
            data-id="${person.id}"
            value="${escapeHtml(phone)}"
            ${isAdmin() ? "" : "readonly"}
          >
        </td>

        <td>
          <select
            class="role-select"
            data-id="${person.id}"
            ${isAdmin() ? "" : "disabled"}
          >
            <option
              value="Team Member"
              ${role === "Team Member" ? "selected" : ""}
            >
              Team Member
            </option>

            <option
              value="Administrator"
              ${role === "Administrator" ? "selected" : ""}
            >
              Administrator
            </option>
          </select>
        </td>

        ${
          isAdmin()
            ? `
          <td>
            <div class="staff-actions">

              <button
                class="link-btn save-btn"
                data-id="${person.id}">
                Save
              </button>

              <button
                class="staff-remove-btn delete-btn"
                data-id="${person.id}">
                Remove
              </button>

            </div>
          </td>
        `
            : ""
        }
      `;

      body.appendChild(row);
    });

    if (isAdmin()) {
      document.querySelectorAll(".save-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          saveStaff(btn.dataset.id);
        });
      });

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          deleteStaff(btn.dataset.id);
        });
      });
    }

  } catch (err) {
    console.error("LOAD STAFF ERROR:", err);

    body.innerHTML = `
      <tr>
        <td colspan="${isAdmin() ? 5 : 4}"
            style="text-align:center; padding:25px;">
          Failed to load staff.
        </td>
      </tr>
    `;

    showMsg(
      `Failed to load staff: ${escapeHtml(err.message)}`,
      false
    );
  }
}


/* =========================================================
   SAVE / EDIT STAFF
========================================================= */

async function saveStaff(id) {

  if (!isAdmin()) {
    showMsg(
      "You do not have permission to edit staff.",
      false
    );
    return;
  }

  const nameInput =
    document.querySelector(`.name-input[data-id="${id}"]`);

  const phoneInput =
    document.querySelector(`.phone-input[data-id="${id}"]`);

  const roleInput =
    document.querySelector(`.role-select[data-id="${id}"]`);

  if (!nameInput || !phoneInput || !roleInput) {
    showMsg("Could not find staff fields.", false);
    return;
  }

  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const role = roleInput.value;

  if (!name) {
    showMsg("Name cannot be empty.", false);
    return;
  }

  try {

    const res = await fetch(`${API_BASE}/api/staff/${id}`, {
      method: "PUT",

      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${getToken()}`
      },

      body: JSON.stringify({
        name,
        phone,
        role
      })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.message || "Failed to update staff");
    }

    showMsg("Staff member updated successfully.", true);

    await loadStaff();

  } catch (err) {

    console.error("SAVE STAFF ERROR:", err);

    showMsg(
      `Failed to save: ${escapeHtml(err.message)}`,
      false
    );
  }
}


/* =========================================================
   DELETE STAFF
========================================================= */

async function deleteStaff(id) {

  if (!isAdmin()) {
    showMsg(
      "You do not have permission to delete staff.",
      false
    );
    return;
  }

  const confirmed = confirm(
    "Remove this staff member?\n\nThey will no longer be able to log in."
  );

  if (!confirmed) return;

  try {

    const res = await fetch(`${API_BASE}/api/staff/${id}`, {
      method: "DELETE",

      headers: {
        Authorization: `Bearer ${getToken()}`
      }
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.message || "Failed to delete staff");
    }

    showMsg(
      "Staff member removed successfully.",
      true
    );

    await loadStaff();

  } catch (err) {

    console.error("DELETE STAFF ERROR:", err);

    showMsg(
      `Failed to remove: ${escapeHtml(err.message)}`,
      false
    );
  }
}


/* =========================================================
   ADD STAFF
========================================================= */

async function addStaff() {

  if (!isAdmin()) {
    showMsg(
      "You do not have permission to add staff.",
      false
    );
    return;
  }

  const name =
    document.getElementById("new-name").value.trim();

  const email =
    document.getElementById("new-email").value.trim();

  const phone =
    document.getElementById("new-phone").value.trim();

  const role =
    document.getElementById("new-role").value;

  if (!name || !email) {
    showMsg(
      "Please enter the staff member's name and email.",
      false
    );
    return;
  }

  try {

    const res = await fetch(`${API_BASE}/api/staff`, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${getToken()}`
      },

      body: JSON.stringify({
        name,
        email,
        phone,
        role
      })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.message || "Failed to add staff");
    }

    showMsg(
      `<strong>${escapeHtml(name)}</strong> was added successfully.
      <br><br>
      Temporary password:
      <br><br>
      <code>${escapeHtml(data.temporaryPassword || "")}</code>
      <br><br>
      Give this temporary password to the staff member.`,
      true
    );

    document.getElementById("new-name").value = "";
    document.getElementById("new-email").value = "";
    document.getElementById("new-phone").value = "";

    await loadStaff();

  } catch (err) {

    console.error("ADD STAFF ERROR:", err);

    showMsg(
      `Failed to add staff: ${escapeHtml(err.message)}`,
      false
    );
  }
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", init);
</script>


<script>
window.addEventListener("load", function () {
    document.body.style.overflow = "auto";
    document.documentElement.style.overflow = "auto";
});
</script>

</body>
</html>
