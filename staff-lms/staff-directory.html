<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Directory | Gouldings Staff LMS</title>

  <!-- Same stylesheets as operations.html, so this page matches the rest of the site -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout/grid.css">
  <link rel="stylesheet" href="css/layout/sidebar.css">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/components/buttons.css">
  <link rel="stylesheet" href="css/components/cards.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Small additions specific to this page only —
       everything else comes from the shared CSS above */
    .staff-table { width: 100%; border-collapse: collapse; }
    .staff-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 13px;
      opacity: .6;
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
    .staff-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      vertical-align: middle;
    }
    .staff-table input[type="text"],
    .staff-table input[type="tel"],
    .staff-table select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid rgba(0,0,0,.15);
      border-radius: 6px;
      font-size: 14px;
    }
    .staff-actions { display: flex; gap: 8px; white-space: nowrap; }
    .staff-remove-btn {
      background: none;
      border: none;
      color: #c0392b;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
    }
    .staff-add-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 640px;
      margin-top: 12px;
    }
    .staff-add-form label { font-size: 13px; opacity: .75; display: block; margin-bottom: 6px; }
    .staff-add-form input, .staff-add-form select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(0,0,0,.15);
      border-radius: 6px;
    }
    .staff-add-form .full-width { grid-column: 1 / -1; }
    .staff-denied {
      padding: 20px;
      border-radius: 10px;
      background: #fee2e2;
      color: #991b1b;
    }
    .staff-temp-password {
      padding: 16px;
      border-radius: 10px;
      background: #dcfce7;
      color: #166534;
      margin-bottom: 18px;
    }
    .staff-temp-password code {
      background: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div id="header"></div>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="page-wrapper">

      <div class="page-header">
        <div class="header-left">
          <h1 class="page-title">Staff Directory</h1>
          <p class="page-subtitle">Manage staff accounts and roles</p>
        </div>
      </div>

      <div id="staffMsg" class="staff-temp-password" style="display:none;"></div>

      <section id="staffContent">
        <p style="opacity:.6;">Loading staff directory…</p>
      </section>

    </div>
  </div>
</div>

<script src="js/common/app.js"></script>

<script>
const API_BASE = "https://icm-website-test-production.up.railway.app";

function getToken() { return localStorage.getItem("staffToken"); }
function getRole() { return (localStorage.getItem("staffRole") || "").trim(); }

function showMsg(text, isSuccess) {
  const box = document.getElementById("staffMsg");
  box.style.display = "block";
  box.style.background = isSuccess ? "#dcfce7" : "#fee2e2";
  box.style.color = isSuccess ? "#166534" : "#991b1b";
  box.innerHTML = text;
}

async function init() {
  const content = document.getElementById("staffContent");

  if (getRole() !== "Administrator") {
    content.innerHTML = `<div class="glass-card staff-denied">Only Administrators can view the staff directory.</div>`;
    return;
  }

  content.innerHTML = `
    <div class="glass-card" style="margin-bottom:20px;">
      <table class="staff-table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th></th></tr>
        </thead>
        <tbody id="staff-body"></tbody>
      </table>
    </div>

    <div class="glass-card">
      <div class="card-title"><h3>Add staff member</h3></div>
      <div class="staff-add-form">
        <div><label>Name</label><input id="new-name" type="text"></div>
        <div><label>Email</label><input id="new-email" type="email"></div>
        <div><label>Phone</label><input id="new-phone" type="tel" placeholder="Optional"></div>
        <div>
          <label>Role</label>
          <select id="new-role">
            <option value="Team Member">Team Member</option>
            <option value="Administrator">Administrator</option>
          </select>
        </div>
        <div class="full-width">
          <button id="add-btn" class="primary-btn">Add staff member</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("add-btn").addEventListener("click", addStaff);
  loadStaff();
}

async function loadStaff() {
  try {
    const res = await fetch(`${API_BASE}/api/staff`, {
      headers: { Authorization: `Bearer ${getToken()}` },
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    const body = document.getElementById("staff-body");
    body.innerHTML = "";

    data.staff.forEach((person) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><input type="text" class="name-input" data-id="${person.id}" value="${person.name}"></td>
        <td>${person.email}</td>
        <td><input type="tel" class="phone-input" data-id="${person.id}" value="${person.phone || ""}"></td>
        <td>
          <select class="role-select" data-id="${person.id}">
            <option value="Team Member" ${person.role === "Team Member" ? "selected" : ""}>Team Member</option>
            <option value="Administrator" ${person.role === "Administrator" ? "selected" : ""}>Administrator</option>
          </select>
        </td>
        <td>
          <div class="staff-actions">
            <button class="link-btn save-btn" data-id="${person.id}">Save</button>
            <button class="staff-remove-btn delete-btn" data-id="${person.id}">Remove</button>
          </div>
        </td>
      `;
      body.appendChild(row);
    });

    document.querySelectorAll(".save-btn").forEach((btn) =>
      btn.addEventListener("click", () => saveStaff(btn.dataset.id))
    );
    document.querySelectorAll(".delete-btn").forEach((btn) =>
      btn.addEventListener("click", () => deleteStaff(btn.dataset.id))
    );
  } catch (err) {
    showMsg("Failed to load staff: " + err.message, false);
  }
}

async function saveStaff(id) {
  const name = document.querySelector(`.name-input[data-id="${id}"]`).value;
  const phone = document.querySelector(`.phone-input[data-id="${id}"]`).value;
  const role = document.querySelector(`.role-select[data-id="${id}"]`).value;

  try {
    const res = await fetch(`${API_BASE}/api/staff/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${getToken()}` },
      body: JSON.stringify({ name, phone, role }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    showMsg("Saved ✅", true);
  } catch (err) {
    showMsg("Failed to save: " + err.message, false);
  }
}

async function deleteStaff(id) {
  if (!confirm("Remove this staff member? They will no longer be able to log in.")) return;
  try {
    const res = await fetch(`${API_BASE}/api/staff/${id}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${getToken()}` },
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    showMsg("Removed ✅", true);
    loadStaff();
  } catch (err) {
    showMsg("Failed to remove: " + err.message, false);
  }
}

async function addStaff() {
  const name = document.getElementById("new-name").value.trim();
  const email = document.getElementById("new-email").value.trim();
  const phone = document.getElementById("new-phone").value.trim();
  const role = document.getElementById("new-role").value;

  if (!name || !email) { showMsg("Fill in name and email.", false); return; }

  try {
    const res = await fetch(`${API_BASE}/api/staff`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${getToken()}` },
      body: JSON.stringify({ name, email, phone, role }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    showMsg(`<strong>${name}</strong> was added. Share this one-time temporary password with them — it will not be shown again:<br><br><code>${data.temporaryPassword}</code>`, true);

    document.getElementById("new-name").value = "";
    document.getElementById("new-email").value = "";
    document.getElementById("new-phone").value = "";
    loadStaff();
  } catch (err) {
    showMsg("Failed to add: " + err.message, false);
  }
}

init();
</script>

<script>
window.addEventListener("load", function () {
    document.body.style.overflow = "auto";
    document.documentElement.style.overflow = "auto";
});
</script>

</body>
</html>
