<header class="header">

    <div class="header-left">

        <div class="header-brand">
            <img src="images/logos/logo-white.png"
                 alt="Gouldings"
                 class="header-logo">

            <div>
                <h2>Gouldings</h2>
                <span>Staff LMS</span>
            </div>
        </div>

    </div>

    <div class="header-right">

        <button class="menu-toggle" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Calendar -->
        <button class="action-btn" id="calendarHeaderBtn" type="button">
            <i data-lucide="calendar-days"></i>
             <span class="notification-count hidden" id="calendarCount"></span>
        </button>

        <!-- Messages -->
        <button class="action-btn" id="messagesBtn">
            <i data-lucide="message-square"></i>
            <span class="notification-count hidden" id="messageCount"></span>
        </button>

        <!-- Notifications -->
        <button class="action-btn" id="notificationsBtn">
            <i data-lucide="bell"></i>
            <span class="notification-count hidden" id="notificationCount"></span>
        </button>

        <!-- Dark Mode -->
        <button class="action-btn">
            <i data-lucide="moon"></i>
        </button>

        <!-- Profile -->
        <div class="header-profile">
            <img
                id="headerProfilePic"
                src="images/avatars/default-avatar.jpg"
                alt="Profile">

            <div>
                <h4 id="headerStaffName">Staff Member</h4>
                <p id="headerStaffRole">Administrator</p>
            </div>
        </div>

    </div>

</header>

<script src="js/notifications.js"></script>
