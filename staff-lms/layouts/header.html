<!--==================================================
    HEADER
===================================================-->

<header class="header">

    <!--==================================================
        LEFT SIDE
    ===================================================-->

   <div class="header-left">

    <!-- Mobile Menu -->

    <!-- Gouldings Logo -->

    <div class="header-brand">

        <img
            src="images/logos/logo-white.png"
            alt="Gouldings"
            class="header-logo">

        <div>

            <h2>Gouldings</h2>

            <span>Staff LMS</span>

        </div>

    </div>

    <!-- Logo (replaces breadcrumb) -->

   
</div>


    <!--==================================================
        RIGHT SIDE
    ===================================================-->

    <div class="header-right">

        <!-- Search -->

        <div class="search-box">

            <i data-lucide="search"></i>

            <input
                type="text"
                placeholder="Search students, courses, meetings...">

        </div>

        <!-- Calendar -->

        <button class="action-btn">

            <i data-lucide="calendar-days"></i>

        </button>

        <!-- Messages -->

       <button class="action-btn" id="messagesBtn">

    <i data-lucide="message-square"></i>

    <span class="notification-count hidden" id="messageCount"></span>
    

</button>

        <!-- Notifications -->

        <button class="action-btn" id="notificationsBtn">

            <i data-lucide="bell"></i>

          
            <span class="notification-count hidden" id="notificationCount"></span>

        </button>

        <!-- Dark Mode -->

        <button class="action-btn">

            <i data-lucide="moon"></i>

        </button>

        <!-- Profile -->
<div class="header-profile">

    <img
         id="headerProfilePic"
         src="images/avatars/default-avatar.jpg"
         alt="Profile">

    <div>

       <h4 id="headerStaffName">Staff Member</h4>

      <p id="headerStaffRole">Administrator</p>

    </div>

</div>
        
    </div>

</header>
