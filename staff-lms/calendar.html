<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Gouldings Staff LMS</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- Global CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/components/calendar.css">
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

  
</head>
<body>
  <div class="app">
    <div id="sidebar"></div>

    <div class="main-content">
      <div id="header"></div>

      <div class="page-wrapper">

        <!-- Page Header -->
        <section class="page-header">
          <div class="header-left">
            <h1 class="page-title">Calendar</h1>
            <p class="page-subtitle">Manage meetings, university events, assessments and holidays.</p>
          </div>

          <div class="header-actions">
            <button id="addEventHeaderBtn" class="primary-btn small">
              <i class="fa-solid fa-plus"></i>
              Add Event
            </button>
          </div>
        </section>

        <!-- CALENDAR LAYOUT -->

        <div class="calendar">

<div class="calendar-header">

<div class="header-left">

<h1>Staff Calendar</h1>

<p>Universal Calendar for Gouldings Staff LMS</p>

</div>

<div class="header-right">

<button class="calendar-btn" id="prevMonth">

<i class="fa-solid fa-chevron-left"></i>

</button>

<div id="monthYear" class="month-title"></div>

<button class="calendar-btn" id="nextMonth">

<i class="fa-solid fa-chevron-right"></i>

</button>

<button class="calendar-btn" id="todayBtn">

Today

</button>

</div>

</div>

<div class="weekdays">

<div>Monday</div>

<div>Tuesday</div>

<div>Wednesday</div>

<div>Thursday</div>

<div>Friday</div>

<div>Saturday</div>

<div>Sunday</div>

</div>

<div id="calendarGrid" class="calendar-grid">

</div>

</div>

<div class="modal" id="eventModal">

<div class="modal-box">

<div class="modal-header">

<h2>Event</h2>

<button id="closeModal">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<div class="modal-body">

<input
type="text"
id="eventTitle"
placeholder="Event Title">

<input
type="date"
id="eventDate">

<input
type="time"
id="eventTime">

<input
type="text"
id="eventLocation"
placeholder="Location">

<select id="eventColour">

<option value="gold">Gold</option>

<option value="blue">Blue</option>

<option value="green">Green</option>

<option value="red">Red</option>

<option value="orange">Orange</option>

<option value="purple">Purple</option>

</select>

<textarea
id="eventDescription"
placeholder="Description"></textarea>

</div>

<div class="modal-footer">

<button
class="delete-btn"
id="deleteEvent">

Delete

</button>

<button
class="save-btn"
id="saveEvent">

Save Event

</button>

</div>

</div>

</div>



     
     
        <!-- Upcoming Events -->
            <div class="glass-card">
              <div class="card-title">
                <h3>Upcoming Events</h3>
                <button class="link-btn">View All</button>
              </div>
              <div id="upcomingEvents"></div>
            </div>
          </aside>

          <!-- CENTER CONTENT -->
          <section class="calendar-main">
            <div class="toolbar">
              <select><option>All Campuses</option></select>
              <select><option>All Calendars</option></select>
              <select><option>All Status</option></select>

              <div class="toolbar-right">
                <button class="view-btn">Day</button>
                <button class="view-btn">Week</button>
                <button class="view-btn active">Month</button>
                <button id="addEventBtn" class="primary-btn">
                  <i class="fa-solid fa-plus"></i>
                  Add Event
                </button>
              </div>
            </div>

            <div class="timeline-card">
              <div class="timeline-header">
                <button>Day <i class="fa-solid fa-chevron-down"></i></button>
                <div class="timeline-date"><i class="fa-regular fa-calendar"></i> Today</div>
              </div>
              <div id="dayTimeline" class="timeline"></div>
            </div>
          </section>

          <!-- RIGHT SIDEBAR -->
          <aside class="calendar-right">
           

            <div class="glass-card">
              <div class="card-title"><h3>Quick Statistics</h3></div>
              <div class="stats-grid">
                <div class="stat-box"><span id="meetingCount">0</span><small>Meetings</small></div>
                <div class="stat-box"><span id="classCount">0</span><small>Classes</small></div>
                <div class="stat-box"><span id="assignmentCount">0</span><small>Assessments</small></div>
                <div class="stat-box"><span id="holidayCount">0</span><small>Holidays</small></div>
              </div>
            </div>
          </aside>
        </section> <!-- .calendar-layout -->

       <!-- Event modal -->
<div class="event-modal" id="eventModal">
  <div class="event-modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Add Event</h2>
      <button id="closeModal" class="icon-btn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="eventTitle">Title</label>
        <input id="eventTitle" type="text" placeholder="Event title" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="eventDate">Date</label>
          <input id="eventDate" type="date" />
        </div>

        <div class="form-group">
          <label for="eventTime">Time</label>
          <input id="eventTime" type="time" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="eventType">Category</label>
          <select id="eventType">
            <option value="meeting">Meeting</option>
            <option value="class">Class</option>
            <option value="assignment">Assessment</option>
            <option value="holiday">Holiday</option>
          </select>
        </div>

        <div class="form-group">
          <label for="eventLocation">Location</label>
          <input id="eventLocation" type="text" placeholder="Conference Room" />
        </div>
      </div>

      <div class="form-group">
        <label for="eventDescription">Description</label>
        <textarea id="eventDescription" rows="3" placeholder="Short description (optional)"></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button id="cancelEvent" class="secondary-btn">Cancel</button>
      <button id="deleteEventBtn" class="secondary-btn" style="display:none;background:transparent;border:1px solid rgba(255,80,80,.12);color:#ff7b7b;">Delete</button>
      <button id="saveEvent" class="primary-btn small">Save Event</button>
    </div>
  </div>
</div>

      </div> <!-- .page-wrapper -->

      <!-- Main Calendar JavaScript -->
      <script src="js/common/app.js"></script>
      <script src="js/components/calendar.js"></script>
    </div> <!-- .main-content -->
  </div> <!-- .app -->
</body>
</html>
