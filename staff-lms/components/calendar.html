<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gouldings Staff LMS Calendar</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#eef3f9;

padding:40px;

color:#1d2a44;

}

.calendar{

max-width:1400px;

margin:auto;

background:#fff;

border-radius:20px;

overflow:hidden;

box-shadow:0 20px 45px rgba(0,0,0,.12);

}

.calendar-header{

display:flex;

justify-content:space-between;

align-items:center;

padding:25px 35px;

background:#0b2b57;

color:white;

}

.header-left h1{

font-size:30px;

font-weight:700;

}

.header-left p{

margin-top:5px;

opacity:.8;

}

.header-right{

display:flex;

gap:10px;

align-items:center;

}

.calendar-btn{

border:none;

background:#d4af37;

color:#0b2b57;

padding:12px 18px;

border-radius:8px;

cursor:pointer;

font-weight:700;

transition:.3s;

}

.calendar-btn:hover{

transform:translateY(-2px);

}

.month-title{

font-size:26px;

font-weight:700;

min-width:260px;

text-align:center;

}

.weekdays{

display:grid;

grid-template-columns:repeat(7,1fr);

background:#f7f9fc;

border-bottom:1px solid #e2e8f0;

}

.weekdays div{

padding:16px;

text-align:center;

font-weight:700;

color:#64748b;

}

.calendar-grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:1px;

background:#dbe4ef;

}

.day{

background:white;

min-height:140px;

padding:12px;

position:relative;

cursor:pointer;

transition:.25s;

}

.day:hover{

background:#f8fbff;

}

.day.inactive{

background:#f3f5f8;

color:#bbb;

}

.day.today{

background:#fff9e8;

border:2px solid #d4af37;

}

.date-number{

font-weight:700;

font-size:18px;

margin-bottom:10px;

}

.events{

display:flex;

flex-direction:column;

gap:5px;

}

.event{

padding:5px 8px;

border-radius:6px;

font-size:12px;

font-weight:600;

overflow:hidden;

white-space:nowrap;

text-overflow:ellipsis;

cursor:pointer;

color:white;

}

.blue{background:#2563eb;}

.green{background:#10b981;}

.red{background:#ef4444;}

.orange{background:#f97316;}

.purple{background:#7c3aed;}

.gold{background:#d4af37;color:#1d2a44;}

.modal{

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.55);

display:none;

justify-content:center;

align-items:center;

z-index:9999;

}

.modal.show{

display:flex;

}

.modal-box{

width:520px;

max-width:95%;

background:white;

border-radius:18px;

overflow:hidden;

}

.modal-header{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 25px;

background:#0b2b57;

color:white;

}

.modal-header button{

background:none;

border:none;

color:white;

font-size:22px;

cursor:pointer;

}

.modal-body{

padding:25px;

display:flex;

flex-direction:column;

gap:16px;

}

.modal-body input,

.modal-body textarea,

.modal-body select{

width:100%;

padding:12px;

border:1px solid #dbe4ef;

border-radius:10px;

outline:none;

}

.modal-body textarea{

height:120px;

resize:none;

}

.modal-footer{

padding:20px 25px;

display:flex;

justify-content:space-between;

background:#fafafa;

}

.delete-btn{

background:#ef4444;

color:white;

border:none;

padding:12px 18px;

border-radius:8px;

cursor:pointer;

}

.save-btn{

background:#d4af37;

color:#0b2b57;

border:none;

padding:12px 18px;

border-radius:8px;

font-weight:700;

cursor:pointer;

}

@media(max-width:1000px){

.calendar-grid{

grid-template-columns:repeat(2,1fr);

}

.weekdays{

display:none;

}

.day{

min-height:120px;

}

}

</style>

</head>

<body>

<div class="calendar">

<div class="calendar-header">

<div class="header-left">

<h1>Staff Calendar</h1>

<p>Universal Calendar for Gouldings Staff LMS</p>

</div>

<div class="header-right">

<button class="calendar-btn" id="prevMonth">

<i class="fa-solid fa-chevron-left"></i>

</button>

<div id="monthYear" class="month-title"></div>

<button class="calendar-btn" id="nextMonth">

<i class="fa-solid fa-chevron-right"></i>

</button>

<button class="calendar-btn" id="todayBtn">

Today

</button>

</div>

</div>

<div class="weekdays">

<div>Monday</div>

<div>Tuesday</div>

<div>Wednesday</div>

<div>Thursday</div>

<div>Friday</div>

<div>Saturday</div>

<div>Sunday</div>

</div>

<div id="calendarGrid" class="calendar-grid">

</div>

</div>

<div class="modal" id="eventModal">

<div class="modal-box">

<div class="modal-header">

<h2>Event</h2>

<button id="closeModal">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<div class="modal-body">

<input
type="text"
id="eventTitle"
placeholder="Event Title">

<input
type="date"
id="eventDate">

<input
type="time"
id="eventTime">

<input
type="text"
id="eventLocation"
placeholder="Location">

<select id="eventColour">

<option value="gold">Gold</option>

<option value="blue">Blue</option>

<option value="green">Green</option>

<option value="red">Red</option>

<option value="orange">Orange</option>

<option value="purple">Purple</option>

</select>

<textarea
id="eventDescription"
placeholder="Description"></textarea>

</div>

<div class="modal-footer">

<button
class="delete-btn"
id="deleteEvent">

Delete

</button>

<button
class="save-btn"
id="saveEvent">

Save Event

</button>

</div>

</div>

</div>

<script>

let currentDate = new Date();

let selectedDate = "";

let editingIndex = null;

let events = JSON.parse(localStorage.getItem("staffCalendarEvents")) || [];

const monthYear = document.getElementById("monthYear");
const calendarGrid = document.getElementById("calendarGrid");

const modal = document.getElementById("eventModal");

const eventTitle = document.getElementById("eventTitle");
const eventDate = document.getElementById("eventDate");
const eventTime = document.getElementById("eventTime");
const eventLocation = document.getElementById("eventLocation");
const eventDescription = document.getElementById("eventDescription");
const eventColour = document.getElementById("eventColour");

function saveStorage(){

localStorage.setItem(

"staffCalendarEvents",

JSON.stringify(events)

);

}

function formatDate(date){

return date.getFullYear()+"-"+

String(date.getMonth()+1).padStart(2,"0")+"-"+

String(date.getDate()).padStart(2,"0");

}

function renderCalendar(){

calendarGrid.innerHTML="";

monthYear.innerHTML=currentDate.toLocaleString(

"default",

{

month:"long",

year:"numeric"

}

);

const year=currentDate.getFullYear();

const month=currentDate.getMonth();

let firstDay=new Date(year,month,1).getDay();

firstDay=(firstDay===0)?6:firstDay-1;

const daysInMonth=new Date(year,month+1,0).getDate();

const prevMonthDays=new Date(year,month,0).getDate();

for(let i=firstDay;i>0;i--){

const div=document.createElement("div");

div.className="day inactive";

div.innerHTML=

"<div class='date-number'>"+

(prevMonthDays-i+1)+

"</div>";

calendarGrid.appendChild(div);

}

for(let day=1;day<=daysInMonth;day++){

const div=document.createElement("div");

div.className="day";

const fullDate=

year+"-"+

String(month+1).padStart(2,"0")+"-"+

String(day).padStart(2,"0");

const today=formatDate(new Date());

if(fullDate===today){

div.classList.add("today");

}

let html="<div class='date-number'>"+day+"</div>";

html+="<div class='events'>";

events.forEach((ev,index)=>{

if(ev.date===fullDate){

html+="<div class='event "+ev.colour+"' data-index='"+index+"'>";

html+=ev.time?ev.time+" ":"";

html+=ev.title;

html+="</div>";

}

});

html+="</div>";

div.innerHTML=html;

div.addEventListener("click",function(e){

if(e.target.classList.contains("event")) return;

openNewEvent(fullDate);

});

calendarGrid.appendChild(div);

}

const totalCells=calendarGrid.children.length;

const remain=42-totalCells;

for(let i=1;i<=remain;i++){

const div=document.createElement("div");

div.className="day inactive";

div.innerHTML="<div class='date-number'>"+i+"</div>";

calendarGrid.appendChild(div);

}

document.querySelectorAll(".event").forEach(item=>{

item.onclick=function(e){

e.stopPropagation();

editEvent(

parseInt(this.dataset.index)

);

};

});

}

function openNewEvent(date){

editingIndex=null;

selectedDate=date;

eventTitle.value="";

eventDate.value=date;

eventTime.value="";

eventLocation.value="";

eventDescription.value="";

eventColour.value="gold";

modal.classList.add("show");

}

function editEvent(index){

editingIndex=index;

const ev=events[index];

eventTitle.value=ev.title;

eventDate.value=ev.date;

eventTime.value=ev.time;

eventLocation.value=ev.location;

eventDescription.value=ev.description;

eventColour.value=ev.colour;

modal.classList.add("show");

}

document.getElementById("saveEvent").onclick=function(){

const obj={

title:eventTitle.value,

date:eventDate.value,

time:eventTime.value,

location:eventLocation.value,

description:eventDescription.value,

colour:eventColour.value

};

if(editingIndex===null){

events.push(obj);

}else{

events[editingIndex]=obj;

}

saveStorage();

modal.classList.remove("show");

renderCalendar();

};

document.getElementById("deleteEvent").onclick=function(){

if(editingIndex!==null){

events.splice(editingIndex,1);

saveStorage();

}

modal.classList.remove("show");

renderCalendar();

};

document.getElementById("closeModal").onclick=function(){

modal.classList.remove("show");

};

window.onclick=function(e){

if(e.target===modal){

modal.classList.remove("show");

}

};

document.getElementById("prevMonth").onclick=function(){

currentDate.setMonth(currentDate.getMonth()-1);

renderCalendar();

};

document.getElementById("nextMonth").onclick=function(){

currentDate.setMonth(currentDate.getMonth()+1);

renderCalendar();

};

document.getElementById("todayBtn").onclick=function(){

currentDate=new Date();

renderCalendar();

};

renderCalendar();

</script>

</body>

</html>
