<section class="calendar-widget">

    <div class="calendar-header">

    <button id="prevMonth" class="calendar-nav">
        <i data-lucide="chevron-left"></i>
    </button>

    <div class="calendar-controls">

        <select id="monthSelect">

            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>

        </select>

        <select id="yearSelect">
        </select>

        <select id="calendarUserFilter" aria-label="Filter calendar by user">
            <option value="all">All users</option>
            <option value="derrick">Derrick (Admin)</option>
            <option value="joy">Joy Banerjee</option>
            <option value="dp">DP</option>
            <option value="prathistha">PRATHISTHA</option>
            <option value="nidhi">NIDHI</option>
        </select>

    </div>


    <button id="nextMonth" class="calendar-nav">
        <i data-lucide="chevron-right"></i>
    </button>

</div>

    
    <div class="calendar-widget-days">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>

    </div>


    <div class="calendar-widget-grid" id="calendarGrid"></div>


    <div class="calendar-footer">
    <button id="todayBtn" class="today-btn">Go to Today</button>
</div>

</section>
