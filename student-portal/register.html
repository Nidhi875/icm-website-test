
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Gouldings Global Academy</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <section class="portal-login">
        <div class="login-box">

            <img
                src="images/logo.png"
                class="login-logo"
                alt="Gouldings Global Academy Logo"
            >

            <h1>Student<br>Portal</h1>
            <p>Create your student account</p>

            <form id="registerForm">
                <input
                    id="fullName"
                    name="fullName"
                    type="text"
                    placeholder="Full Name"
                    autocomplete="name"
                    required
                >

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <input
                    id="studentId"
                    name="studentId"
                    type="text"
                    placeholder="Student ID"
                    required
                >

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button id="registerButton" type="submit">
                    Register
                </button>

                <p id="registerMessage" role="status" aria-live="polite"></p>
            </form>

            <p class="register-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </section>

    <script>
        const API_URL =
            "https://icm-website-test-production.up.railway.app/api/auth/register";

        const registerForm = document.getElementById("registerForm");
        const registerButton = document.getElementById("registerButton");
        const registerMessage = document.getElementById("registerMessage");

        registerForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const studentId = document.getElementById("studentId").value.trim();
            const password = document.getElementById("password").value;

            registerMessage.textContent = "";
            registerButton.disabled = true;
            registerButton.textContent = "Registering...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        fullName,
                        email,
                        studentId,
                        password
                    })
                });

                let data;

                try {
                    data = await response.json();
                } catch {
                    throw new Error("The server returned an invalid response.");
                }

                if (!response.ok) {
                    throw new Error(
                        data.message || "Registration failed. Please check your details."
                    );
                }

                registerMessage.textContent =
                    data.message || "Registration successful. Redirecting to login...";

                registerForm.reset();

                setTimeout(function () {
                    window.location.href = "login.html";
                }, 1200);

            } catch (error) {
                registerMessage.textContent =
                    error.message === "Failed to fetch"
                        ? "Cannot connect to the registration server. Please try again later."
                        : error.message;
            } finally {
                registerButton.disabled = false;
                registerButton.textContent = "Register";
            }
        });
    </script>
</body>
</html>
